name: "ESP32BTMonitor"
arch: "amd64"
version: "1.0.0"
maintainer: "github.com/saintpedr0o"
description: "ESP32 BlueTooth PC monitor"
contents:
  - src: "build/esp32-bt-monitor-amd64-bin"
    dst: "/usr/bin/esp32btmonitor"
  - src: "icon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/esp32btmonitor.png"
  - src: "esp32btmonitor.desktop"
    dst: "/usr/share/applications/esp32btmonitor.desktop"
